<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steward Deep Link</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f5f5f7;
        background:
          radial-gradient(130% 95% at 12% 4%, rgba(70, 96, 214, 0.5) 0%, rgba(70, 96, 214, 0) 55%),
          radial-gradient(110% 85% at 92% 10%, rgba(122, 78, 216, 0.38) 0%, rgba(122, 78, 216, 0) 52%),
          linear-gradient(150deg, #0a1022 0%, #120e2e 45%, #191040 75%, #120b2c 100%);
      }
      .box {
        padding: 20px 32px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(20px);
        text-align: center;
      }
      code {
        font-family: ui-monospace, monospace;
        background: rgba(255, 255, 255, 0.12);
        padding: 2px 8px;
        border-radius: 6px;
      }
      .hint { opacity: 0.6; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="status">正在打开命令框…</div>
      <div class="hint" id="hint"></div>
    </div>
    <script>
      // Steward 深链：chrome-extension://<id>/deeplink.html?q=tab%20youtube
      // 在活动标签页中打开命令框并填入查询词
      (function () {
        var params = new URLSearchParams(window.location.search);
        var q = (params.get("q") || "").slice(0, 300);
        var status = document.getElementById("status");
        var hint = document.getElementById("hint");
        if (!q) {
          status.textContent = "缺少 q 参数";
          hint.textContent = "用法: deeplink.html?q=tab youtube";
          return;
        }
        hint.textContent = "查询: " + q;
        try {
          chrome.runtime.sendMessage(
            { action: "openBoxWithQuery", data: q },
            function (resp) {
              if (chrome.runtime.lastError || !resp || !resp.ok) {
                status.textContent = "无法打开命令框（请先打开一个网页）";
              } else {
                status.textContent = "已打开命令框";
              }
              setTimeout(function () {
                window.close();
              }, 1200);
            }
          );
        } catch (e) {
          status.textContent = "扩展未加载";
        }
      })();
    </script>
  </body>
</html>
